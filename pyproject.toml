[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "wellfriend-models"
version = "0.1.0"
description = "Reproducible Wellfriend model research, artifact validation, and registry contracts."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]
torch = ["torch>=2.5,<3"]
onnx = ["onnx>=1.16,<2"]
quantization = ["onnxruntime>=1.20,<2"]
benchmark = []

[tool.setuptools.packages.find]
include = ["wellfriend_models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.unittest]
start-directory = "tests"
