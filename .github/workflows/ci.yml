name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: python -m pytest -q
      - run: python tools/check_dependency_register.py
      - run: python -m wellfriend_models.datasets.validate datasets/examples/synthetic-document-manifest.json
      - run: python -m wellfriend_models.registry.validate registry/document-detector/placeholder --allow-placeholder
      - run: python -m wellfriend_models.registry.index registry/index.json --allow-placeholders
      - run: python -m wellfriend_models.benchmarks.run --smoke
