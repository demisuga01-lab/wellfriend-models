name: Optional release gates
on: workflow_dispatch
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install -e ".[dev]"
      - run: python tools/check_ecosystem_compatibility.py
      - run: python -m wellfriend_models.registry.index registry/index.json --allow-placeholders --allow-nonproduction
